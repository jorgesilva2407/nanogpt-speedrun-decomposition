# Environment lock for the study. Lines marked PINNED come from upstream record #18 (45544f5) or, for torch, from
# the 2026-10-18 decision to use the stable release (launch/Dockerfile.NOTE.md). Lines marked RESOLVED were resolved
# for linux x86_64 / Python 3.12 with `uv pip compile` (not installed). Lines marked UNVERIFIED cannot be established
# without building the image and must be replaced by `pip freeze` output from the built image before the first real
# run (see SPIKE.md S4):
#   docker run --rm modded-nanogpt-flagged:<sha> pip freeze > launch/env.lock.frozen
base_image=nvidia/cuda:12.6.2-cudnn-devel-ubuntu24.04          # PINNED (Dockerfile FROM)
python=3.12.7                                                 # PINNED (Dockerfile ENV PYTHON_VERSION)
torch==2.6.0+cu126                                            # PINNED (stable; upstream's nightly 2.6.0.dev20241231 was pruned)
torch_index=https://download.pytorch.org/whl/cu126            # PINNED
triton==3.2.0                                                 # RESOLVED (torch 2.6.0 dependency)
nvidia-cudnn-cu12==9.5.1.17                                   # RESOLVED (torch 2.6.0+cu126 dependency)
nvidia-nccl-cu12==2.21.5                                      # RESOLVED (torch 2.6.0+cu126 dependency)
numpy                                                         # UNVERIFIED (unpinned upstream)
tqdm                                                          # UNVERIFIED (unpinned upstream)
huggingface-hub                                               # UNVERIFIED (unpinned upstream)
pyyaml                                                        # UNVERIFIED (added here; tools/launch only, the trainer reads resolved JSON)
