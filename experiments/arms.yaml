# Arms of the study (proposal section 2), mapped onto train_flagged.py switches.
# An arm is a set of flag values and/or config values that are switched together. "from" is the value in preset r11
# (the floor), "to" the value in preset r18 (the ceiling). Leave-one-out (LOO) applies r18 -> "from" for the arm only;
# add-one-in (AOI) applies r11 -> "to" for the arm only. Hyperparameters not listed stay at the preset's value.
# Sub-arms marked separable can be run on their own (matrix.py --split-subarms); by default they move with the arm.
# Non-arm switches (rotary_variant, fp32_small_params, code_opts_17/18, loader/schedule/vocab config) are not
# arms: they always follow the preset a configuration starts from.
schema: 1
arms:
  - id: A1a
    name: FlexAttention kernel
    record: 12
    flags: {flex_kernel: [false, true]}
    prediction_ref: flexattention_kernel
    rq2: false
  - id: A1b
    name: 64K-ctx sliding window + document masking
    record: 12
    flags: {long_context: [false, true], doc_masking: [false, true]}
    subarms:
      - {id: A1b.ctx, flags: [long_context], separable: true}
      - {id: A1b.doc, flags: [doc_masking], separable: true}
    prediction_ref: context_64k
    rq2: true
  - id: A2
    name: attention window warmup
    record: 13
    flags: {window_warmup: [false, true]}
    prediction_ref: window_warmup
    rq2: true
  - id: A3
    name: value embeddings (VE rung 1)
    record: 14
    flags: {value_embeds: [false, true]}
    ve_rung: 1
    prediction_ref: value_embeddings
    rq2: true
  - id: A4
    name: U-net value embeddings (VE rung 2)
    record: 15
    flags: {ve_unet: [false, true], ve_lambdas2: [false, true]}
    subarms:
      - {id: A4.unet, flags: [ve_unet], separable: true}
      - {id: A4.lambdas2, flags: [ve_lambdas2], separable: true}
    ve_rung: 2
    prediction_ref: unet_ve
    rq2: true
  - id: A4b
    name: "#15 assorted code optimizations"
    record: 15
    flags: {code_opts_15: [false, true], muon_ema_momentum: [false, true], blockmask_manual: [false, true]}
    subarms:
      - {id: A4b.impl, flags: [code_opts_15], separable: true}
      - {id: A4b.ema, flags: [muon_ema_momentum], separable: true}
      - {id: A4b.blockmask, flags: [blockmask_manual], separable: true}
    prediction_ref: unet_ve
    rq2: false
    note: "proposal reports it with A4 ('split out or report as a pair'); split here"
  - id: A5
    name: split VE + block sliding window + separate block mask (VE rung 3)
    record: 16
    flags: {ve_split: [false, true], block_window: [false, true], blockmask_separate: [false, true]}
    subarms:
      - {id: A5.split, flags: [ve_split], separable: true}
      - {id: A5.blockwin, flags: [block_window], separable: true}
      - {id: A5.sepmask, flags: [blockmask_separate], separable: true}
    ve_rung: 3
    prediction_ref: split_ve_block_window
    rq2: true
  - id: A5b
    name: "#16 MFU tweaks"
    record: 16
    flags: {code_opts_16: [false, true]}
    prediction_ref: split_ve_block_window
    rq2: false
  - id: A6
    name: sparsified VE + improved rotary (VE rung 4)
    record: 17
    flags: {ve_sparsify: [false, true], rope_half_truncate: [false, true]}
    subarms:
      - {id: A6.sparse, flags: [ve_sparsify], separable: true}
      - {id: A6.rope, flags: [rope_half_truncate], separable: true}
    ve_rung: 4
    prediction_ref: sparsified_ve_rotary
    rq2: true
  - id: A6b
    name: dropped attention layer (capacity change)
    record: 17
    flags: {drop_attn_layer: [false, true]}
    prediction_ref: dropped_attention_layer
    rq2: true
  - id: A7
    name: logit softcap 30 -> 15
    record: 18
    config: {logit_softcap: [30, 15]}
    prediction_ref: softcap
    rq2: true
  - id: A8
    name: Muon -> AdamW (positive control)
    record: 3
    flags: {optimizer: [muon, adamw]}
    direction: removal_from_both   # Muon is in both fixed points: both configurations swap it out
    prediction_ref: muon_adamw
    rq2: false
    adamw_lr_sweep: [0.0009, 0.0018, 0.0036]
non_arm_switches:
  flags: [rotary_variant, fp32_small_params, code_opts_17, code_opts_18]
  config: [loader_shard_rule, loader_replay_first_round, lr_schedule_form, cooldown_frac, embed_vocab_size, window_block_formula]
