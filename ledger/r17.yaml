- id: H010
  file: train_gpt2.py
  header: '@@ -141,24 +143,17 @@'
  description: 'CastedLinear weight.type_as(x); Rotary rewritten: half-truncated frequencies (1/1024)**linspace(0,1,dim/4) followed by dim/4 zeros;
    cos/sin for all 65,536 positions precomputed in fp32 as nn.Buffer (cast to bf16 by the global model.bfloat16()); rotation in fp32'
  category:
  - model-mechanism
  - cosmetic
  flag:
  - rope_half_truncate
  - rotary_variant
  provenance: direct
  bundled: true
  numerics: changed
  parts:
  - what: 'frequency spectrum: 32 rotating pairs with periods 2*pi .. 2*pi*1024 and 32 non-rotating pairs (base 10000, 64 pairs before)'
    flag: rope_half_truncate
    category: model-mechanism
  - what: 'implementation: tables from fp32 angles (then bf16 storage under the global cast) instead of bf16 angles; the rotation itself in fp32;
      rotary_variant v14 -> v17'
    flag: rotary_variant
    category: model-mechanism
  - what: weight.type_as(x) == weight.to(x.dtype)
    flag: none
    category: cosmetic
  note: The README's 'improve rotary embeddings' bundles a new frequency spectrum (arm-level mechanism) with a precision/implementation change
    (non-arm). They are separate flags; rope_half_truncate is also defined for the older variants (non-historical combinations).
