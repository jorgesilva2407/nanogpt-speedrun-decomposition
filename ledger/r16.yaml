  header: '@@ -258,45 +260,63 @@'
  description: 'modules renamed and re-ordered (embed, blocks, value_embeds after the blocks, lm_head); block mask: window counted in whole blocks
    with the token-level window removed from mask_mod, fully-unmasked blocks passed separately as full blocks; value embeddings from the ValueEmbedding
    module'
  category:
  - model-mechanism
  - throughput-only
  - cosmetic
  flag:
  - block_window
  - blockmask_separate
  - ve_split
  provenance: direct
  bundled: true
  numerics: changed
  parts:
  - what: 'window_bm = q_blk - kv_blk < n_blocks with window_full_bm = window_bm and mask_mod = causal & document: every key in a selected block
      is visible (no token-level window)'
    flag: block_window
    category: model-mechanism
  - what: full_bm (strictly-causal, in-window, single-document block pairs) passed as full blocks; partial = nonzero ^ full gets mask_mod. full
      is a subset of nonzero, and the mask_mod is all-true on full blocks, so the attended set is unchanged; FlexAttention processes the two lists
      in separate loops (accumulation order may differ)
    flag: blockmask_separate
    category: throughput-only
    numerics: ulp-level
  - what: value_embeds module created after the blocks (moves its init draws after the blocks)
    flag: ve_split
    category: model-mechanism
  - what: renames transformer.wte/h -> embed/blocks (the flagged trainer keeps r11 names; tools/gate.py name map), docs.view vs reshape, argsort
      helper, arange(512) == S//128
    flag: none
    category: cosmetic
  note: 'block_window with a block count n: a query at the start of its block sees ~ (n-1)*128+1 keys, at the end ~ n*128 (vs exactly w with a
    token window).'
