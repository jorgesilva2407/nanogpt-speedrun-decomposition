  - id: H012
    file: train_gpt2.py
    header: "@@ -251,13 +268,29 @@"
    description: "block mask built directly at 128-token-block granularity: block-level causal, document-range overlap and window ceil((w+127)/128) blocks, BlockMask.from_kv_blocks with the token-level mask_mod for every selected block; forward argument renamed sliding_window"
    category: model-mechanism
    flag: [blockmask_manual, window_warmup]
    provenance: inferred
    bundled: true
    numerics: changed
    note: >-
      Intended as a speed-up (avoids create_block_mask), but it is not semantics-preserving: a key block at block
      distance ceil(w/128) can still contain keys within w tokens of the query (e.g. w = 128k, query at the start
      of its block, key at the end of its block), and that block is not selected, so those pairs are masked although
      the mask_mod would allow them. The effective window is slightly shorter near its edge. Verified by reading the
      index arithmetic; not measured.
