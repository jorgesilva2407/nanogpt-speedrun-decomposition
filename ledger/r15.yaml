  - id: H003
    file: train_gpt2.py
    header: "@@ -83,42 +79,59 @@"
    description: "Muon rewritten: parameters grouped by size with per-group bf16 update buffers; each rank orthogonalises one parameter per round, async all_gather overlapped with the next round; update scale applied as add_ alpha; momentum as EMA via lerp_; type annotations"
    category: [throughput-only, model-mechanism, cosmetic]
    flag: [code_opts_15, muon_ema_momentum]
    provenance: inferred
    bundled: true
    numerics: changed
    parts:
      - {what: "distribution (all_reduce of a flat buffer -> grouped async all_gather) and scale as alpha (-lr*s with s in {1, 2}; multiplying by a power of two commutes with rounding, so updates are bit-identical)", flag: code_opts_15, category: throughput-only, numerics: identical}
      - {what: "buf.lerp_(g, 1-m); g = g.lerp_(buf, m)  vs  buf = m*buf + g; g = g + m*buf. With constant m the two directions are proportional (factor 1-m) and Newton-Schulz normalises scale; during momentum warmup (m varies 0.85 -> 0.95 over the first 300 steps) they are not proportional", flag: muon_ema_momentum, category: model-mechanism, numerics: changed}
      - {what: "type annotations, local variable names", flag: none, category: cosmetic}
