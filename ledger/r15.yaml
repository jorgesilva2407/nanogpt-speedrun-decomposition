title: "U-net pattern value embeddings, assorted code optimizations"
snapshot_from: r14
snapshot_to: r15
diff: diffs/r15-vs-r14.diff
attribution_note: >-
  The record bundles two submissions (README contributors @leloykun, @YouJiacheng). Attribution of hunks to the
  'U-net value embeddings' sub-arm vs the 'assorted code optimizations' sub-arm uses external evidence: PR #45
  (leloykun, 'add 12/7/24 record', not merged) contains the U-net VE pattern and the two-lambda mixing; PR #43
  (YouJiacheng, merged 2024-12-09) contains the loader '+1' and perf_counter; YouJiacheng's gist 1fed9527 holds
  the final code. Such attributions are marked provenance: inferred.
