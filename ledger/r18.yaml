record: 18
title: Lower logit softcap from 30 to 15
snapshot_from: r17
snapshot_to: r18
diff: diffs/r18-vs-r17.diff
attribution_note: 'Commit 45544f5 changes only the softcap (H026) and num_iterations (part of H030). Everything else in this diff comes from master
  commits between the #16 code and #18 (2024-12-13..2025-01-01, EXPLORATION.md section 7), i.e. Keller''s re-implementation of #17 that #18 was
  built on; #17''s own log was produced by different (off-repo) code. Per-hunk commit attributions found with git log -S are inferred.'
