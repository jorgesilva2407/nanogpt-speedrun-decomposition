    description: "build the attention mask per micro-batch: causal & same-document & (q - kv < 1024) over one 65,536-token row (idx is 1-D, embedded as idx[None])"
    category: model-mechanism
    flag: [long_context, doc_masking, flex_kernel, "config:attn_window"]
    provenance: direct
    bundled: true
    numerics: changed
    coupled:
      - "attn_window: mechanically coupled to long_context (sliding-window length; 1024 here, warmed up from #13)"
    parts:
      - {what: "one 64K-token row instead of 64 rows of 1024; sliding window instead of row boundaries; rotary positions 0..65535", flag: long_context, category: model-mechanism}
      - {what: "document mask docs[q] == docs[kv]", flag: doc_masking, category: model-mechanism}
      - {what: "create_block_mask(..., _compile=True) for FlexAttention", flag: flex_kernel, category: throughput-only}
    note: "The README calls this '64K-ctx', but the attention window stays 1024 tokens; what changes is that windows slide across the old row boundaries and stop at document boundaries. doc_masking is unbundled from long_context: it is also defined on 1024-token rows (mask within the row)."
