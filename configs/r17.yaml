# Preset r17 = record #17 (sparsify value embeddings, improve rotary embeddings, drop an attn layer), 2024-12-17.
# Snapshot: work/records/r17/log_source/train_gpt2.py (no commit holds it; the committed log was run 2024-12-25;
# YouJiacheng's gist dff723d9 log of 2024-12-23 embeds the same model code).
# Every value below is the literal in that snapshot; tools/extract_constants.py checks it.
# Every value below is the literal in that snapshot; tools/extract_constants.py checks it.
preset: r17
flags:
  flex_kernel: true
  long_context: true
  doc_masking: true
  rotary_variant: v17
  window_warmup: true
  value_embeds: true
  ve_unet: true
  ve_lambdas2: true
  code_opts_15: true
  muon_ema_momentum: true
  blockmask_manual: true
  ve_split: true
  block_window: true
  blockmask_separate: true
  code_opts_16: true
  ve_sparsify: true
  rope_half_truncate: true
  drop_attn_layer: true
  code_opts_17: true
  fp32_small_params: false
  code_opts_18: false
  optimizer: muon               # arm-muon positive control: adamw replaces Muon on the hidden matrices
hparams:
  input_bin: data/fineweb10B/fineweb_train_*.bin
  input_val_bin: data/fineweb10B/fineweb_val_*.bin
  global_batch_tokens: 524288   # record: batch_size 8 sequences x sequence_length 64*1024
  micro_batch_tokens: 65536     # record: one sequence of 64*1024 per device
  sequence_length: 1024         # unused at r12 (long_context: one 64K row per micro-batch); the r11 value
  loader_shard_rule: ge_plus1   # record: `if pos + batch_size + 1 >= len(tokens): advance()` (PR #43)
  loader_replay_first_round: false  # record: no train_loader.reset() before the loop
  num_iterations: 1490
  warmup_iters: 0
  lr_schedule_form: iters       # warmup_iters / warmdown_iters (records #11-#17)
  cooldown_frac: 0.4            # unused (lr_schedule_form iters); record #18 value
  warmdown_iters: 600           # record calls it cooldown_iters
  weight_decay: 0
  val_loss_every: 125
  val_tokens: 10485760
  save_every: 0
  vocab_size: 50304
  embed_vocab_size: 50257      # record: GPTConfig(vocab_size=50257); lm_head uses the next multiple of 128 (50304)
  n_layer: 12
  n_head: 6
  n_embd: 768
  logit_softcap: 30
  attn_window: 1024        # unused at r13 (window_warmup supplies the window); the r12 value
  lr_embed: 0.6
  lr_head: 0.008
  lr_muon: 0.05
  lr_scalar: 0.04
  adam_betas: [0.8, 0.95]
  muon_momentum: 0.95
  muon_momentum_warmup_start: 0.85
  muon_momentum_warmup_end: 0.95
  muon_momentum_warmup_steps: 300
  window_warmup_start: 64     # record (blocks): int(((1 - frac_done) * 64 + frac_done * 1792 + 64) // 128)
  window_warmup_end: 1792
  window_warmup_quantum: 64
  dropped_attn_layer: 7        # record: if layer_idx != 7
  ve_sparse_tables: 3          # record: [ve[0], ve[1], ve[2], None x 6, ve[0], ve[1], ve[2]]
  window_block_formula: r16    # used with block_window (records #16-#17)
  adamw_lr: 0.0018             # used only with optimizer: adamw (record #2's AdamW lr per its README, 'IIRC'); swept
  adamw_betas: [0.9, 0.95]
  adamw_weight_decay: 0
measurement:                   # never affects training (proposal v8 defaults; see README 'open decision')
  val_every_final_third: 25    # extra validations in the last third of training (hparams.val_loss_every = 125 stays the base cadence)
  val_final_third_fraction: 1.0  # 0.2 + val_every_final_third 5 = the never-adopted 'fixed 20% subset every 5 steps' alternative
  timing_warmup_steps: 10      # timing.jsonl marks steps < 10 as compile warm-up (the records' own 'ignore first 10 steps')
