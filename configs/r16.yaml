# Preset r16 = record #16 (split value embeddings, block sliding window, separate block mask; first titled
# "MFU tweaks"), 2024-12-10. Snapshot: work/records/r16/log_source/train_gpt2.py (== 0690f2c, identical).
# Every value below is the literal in that snapshot; tools/extract_constants.py checks it.
# Every value below is the literal in that snapshot; tools/extract_constants.py checks it.
preset: r16
flags:
  flex_kernel: true
  long_context: true
  doc_masking: true
  rotary_variant: v14
  window_warmup: true
  value_embeds: true
  ve_unet: true
  ve_lambdas2: true
  code_opts_15: true
  muon_ema_momentum: true
  blockmask_manual: true
  ve_split: true
  block_window: true
  blockmask_separate: true
  code_opts_16: true
  ve_sparsify: false
  rope_half_truncate: false
  drop_attn_layer: false
  code_opts_17: false
hparams:
  input_bin: data/fineweb10B/fineweb_train_*.bin
  input_val_bin: data/fineweb10B/fineweb_val_*.bin
  global_batch_tokens: 524288   # record: batch_size 8 sequences x sequence_length 64*1024
  micro_batch_tokens: 65536     # record: one sequence of 64*1024 per device
  sequence_length: 1024         # unused at r12 (long_context: one 64K row per micro-batch); the r11 value
  loader_shard_rule: ge_plus1   # record: `if pos + batch_size + 1 >= len(tokens): advance()` (PR #43)
  loader_replay_first_round: false  # record: no train_loader.reset() before the loop
  num_iterations: 1480
  warmup_iters: 0
  warmdown_iters: 600           # record calls it cooldown_iters
  weight_decay: 0
  val_loss_every: 125
  val_tokens: 10485760
  save_every: 0
  vocab_size: 50304
  embed_vocab_size: 50304
  n_layer: 12
  n_head: 6
  n_embd: 768
  logit_softcap: 30
  attn_window: 1024        # unused at r13 (window_warmup supplies the window); the r12 value
  lr_embed: 0.6
  lr_head: 0.008
  lr_muon: 0.05
  lr_scalar: 0.04
  adam_betas: [0.8, 0.95]
  muon_momentum: 0.95
  muon_momentum_warmup_start: 0.85
  muon_momentum_warmup_end: 0.95
  muon_momentum_warmup_steps: 300
  window_warmup_start: 64     # record (blocks): int(((1 - frac_done) * 64 + frac_done * 1792 + 64) // 128)
  window_warmup_end: 1792
  window_warmup_quantum: 64
  dropped_attn_layer: 7        # unused (drop_attn_layer off); record #17 value
  ve_sparse_tables: 3          # unused (ve_sparsify off); record #17 value
