# Preset r11 = record #11 (U-net skip connections & double lr), 2024-11-10.
# Snapshot: work/records/r11/log_source/train_gpt2.py (embedded in the committed log; == ff93d20b up to a
# docstring prefix). Every value below is the literal in that snapshot; tools/extract_constants.py checks it.
preset: r11
flags:
  flex_kernel: false
  long_context: false
  doc_masking: false
  rotary_variant: v11
  window_warmup: false
  value_embeds: false
  ve_unet: false
  ve_lambdas2: false
  code_opts_15: false
  muon_ema_momentum: false
  blockmask_manual: false
  ve_split: false
  block_window: false
  blockmask_separate: false
  code_opts_16: false
  ve_sparsify: false
  rope_half_truncate: false
  drop_attn_layer: false
  code_opts_17: false
  fp32_small_params: false
  code_opts_18: false
hparams:
  input_bin: data/fineweb10B/fineweb_train_*.bin
  input_val_bin: data/fineweb10B/fineweb_val_*.bin
  global_batch_tokens: 524288   # record: batch_size 8*64 sequences x sequence_length 1024
  micro_batch_tokens: 65536     # record: device_batch_size 64 x sequence_length 1024
  sequence_length: 1024
  loader_shard_rule: gt_plus1   # record: `if pos + (B*T*W + 1) > len(tokens): advance()`
  loader_replay_first_round: true  # record: prefetch, then train_loader.reset() before the loop
  num_iterations: 3000
  warmup_iters: 0
  lr_schedule_form: iters       # warmup_iters / warmdown_iters (records #11-#17)
  cooldown_frac: 0.4            # unused (lr_schedule_form iters); record #18 value
  warmdown_iters: 900
  weight_decay: 0
  val_loss_every: 125
  val_tokens: 10485760
  save_every: 0
  vocab_size: 50304
  embed_vocab_size: 50304
  n_layer: 12
  n_head: 6
  n_embd: 768
  logit_softcap: 30
  attn_window: 1024        # unused at r11 (long_context off); the r12 value
  lr_embed: 0.6
  lr_head: 0.008
  lr_muon: 0.04
  lr_scalar: 0.04
  adam_betas: [0.9, 0.95]
  muon_momentum: 0.95
  muon_momentum_warmup_start: 0.85
  muon_momentum_warmup_end: 0.95
  muon_momentum_warmup_steps: 500
  window_warmup_start: 64     # unused (window_warmup off); record #13 values
  window_warmup_end: 1792
  window_warmup_quantum: 64
  dropped_attn_layer: 7        # unused (drop_attn_layer off); record #17 value
  ve_sparse_tables: 3          # unused (ve_sparsify off); record #17 value
  window_block_formula: r16    # unused (block_window off)
